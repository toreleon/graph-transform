[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-transform"
version = "0.1.0"
description = "Algebraic graph rewriting engine for code refactoring operators"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
viz = ["graphviz>=0.20"]
mcp = ["mcp>=1.9.0,<2"]

[project.scripts]
graph-transform = "graph_transform.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_transform"]
