[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-transform"
version = "0.1.0"
description = "MCP server providing verified code transformations for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
viz = ["graphviz>=0.20"]

[project.scripts]
gt = "graph_transform.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_transform"]
